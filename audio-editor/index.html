/* ---------- bron/doel-montage (zoals in Sequoia, Pyramix, SADiE) ----------
   Doelpunt D: een plek in de edit. Bronpunt B: dezelfde noot in een take.
   Overnemen: de edit gaat vanaf D verder met de take vanaf B (alles na D wordt vervangen),
   met een crossfade op D. Werkt ook als de takes in tempo verschillen. */
S.pts = { dest: null, destOut: null, src: null, srcOut: null };

/** Take waar een bronpunt bij hoort: de take die solo speelt, anders de geselecteerde take. */
function sourceTakeContext() {
  const p = S.playing;
  if (p && p.mode === 'take') return takeOf(p.takeId);
  if (S.sel && S.sel.kind === 'take') return takeOf(S.sel.id);
  if (S.range) return takeOf(S.range.takeId);
  return null;
}

/** D = doel in, ⇧D = doel uit. Na het zetten van 'in' vervalt een eerder 'uit' als dat ervoor ligt. */
function setDestPoint(t = S.playhead, out = false) {
  t = Math.max(0, t);
  const P = S.pts;
  if (out) {
    if (P.dest == null) { toast('Zet eerst het begin met D (Doel in)'); return; }
    if (t <= P.dest + 0.02) { toast('Doel uit moet na Doel in liggen'); return; }
    P.destOut = t;
  } else {
    P.dest = t;
    if (P.destOut != null && P.destOut <= t + 0.02) P.destOut = null;
  }
  S.dirty = true; updateButtons(); if (!S.playing) renderInspector();
  toast(P.destOut != null
    ? `Te vervangen: ${fmt(P.dest, 2)} – ${fmt(P.destOut, 2)}. Klik de take die je wilt en druk E.`
    : `Doel in op ${fmt(P.dest, 2)}. Kies een take en druk E om vanaf hier verder te gaan, of zet ook Doel uit (⇧D) om alleen een stuk te vervangen.`);
}

/** B = bron in, ⇧B = bron uit (in de geselecteerde of solo spelende take). */
function setSourcePoint(out = false) {
  const take = sourceTakeContext();
  if (!take) { toast('Klik eerst in een take-baan (of speel een take solo af) en druk dan B'); return; }
  const s = S.playhead - take.sync;
  if (s < 0 || s > take.buffer.duration) { toast('De afspeelkop staat buiten deze take'); return; }
  const P = S.pts;
  if (out) {
    if (!P.src || P.src.takeId !== take.id) { toast('Zet eerst Bron in (B) in deze take'); return; }
    if (s <= P.src.s + 0.02) { toast('Bron uit moet na Bron in liggen'); return; }
    P.srcOut = s;
  } else {
    P.src = { takeId: take.id, s };
    if (P.srcOut != null && P.srcOut <= s + 0.02) P.srcOut = null;
  }
  S.dirty = true; updateButtons(); if (!S.playing) renderInspector();
  toast(`Bron ${out ? 'uit' : 'in'} in "${take.name}" op ${fmt(s, 2)} (in de take).${P.dest == null ? ' Zet nu Doel in met D.' : ' Druk E om over te nemen.'}`);
}

function clearPoints() { S.pts = { dest: null, destOut: null, src: null, srcOut: null }; S.dirty = true; updateButtons(); }

/** Mono-signaal van een take over [s0,s1] in de bron (buiten de take: stilte). */
function takeMono(take, s0, s1, sr) {
  const n = Math.max(1, Math.round((s1 - s0) * sr)), out = new Float32Array(n), d = take.data, tsr = take.buffer.sampleRate, len = d[0].length;
  for (let k = 0; k < n; k++) {
    const i = Math.round((s0 + k / sr) * tsr);
    if (i < 0 || i >= len) continue;
    let v = 0; for (const ch of d) v += ch[i]; out[k] = v / d.length;
  }
  return out;
}
/** Inzet-curve (stijging van het volume per 5 ms) van een signaal. */
function onsetCurve(x, sr, rate = 200) {
  const hop = Math.round(sr / rate), frames = Math.floor(x.length / hop);
  const rms = new Float32Array(frames), fl = new Float32Array(frames);
  for (let f = 0; f < frames; f++) { let s = 0; for (let k = f * hop; k < (f + 1) * hop; k++) s += x[k] * x[k]; rms[f] = Math.sqrt(s / hop); }
  for (let f = 1; f < frames; f++) fl[f] = Math.max(0, rms[f] - rms[f - 1]);
  let m = 0; for (const v of fl) m += v; m /= frames || 1;
  for (let f = 0; f < frames; f++) fl[f] -= m;
  return fl;
}

/* Toonhoogteprofiel (chroma): per 5 ms hoeveel energie er in elk van de 12 toonklassen zit.
   Zo herken je dezelfde passage aan de noten, ook als tempo en klank verschillen. */
const FFTN = 1024;
const fftTab = (() => {
  const N = FFTN, rev = new Uint32Array(N), cos = new Float64Array(N / 2), sin = new Float64Array(N / 2), win = new Float64Array(N);
  const bits = Math.log2(N);
  for (let i = 0; i < N; i++) { let r = 0; for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b); rev[i] = r; }
  for (let i = 0; i < N / 2; i++) { cos[i] = Math.cos((2 * Math.PI * i) / N); sin[i] = -Math.sin((2 * Math.PI * i) / N); }
  for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N);
  return { rev, cos, sin, win };
})();
function fftMag(x, at, re, im) {
  const N = FFTN, { rev, cos, sin, win } = fftTab;
  for (let i = 0; i < N; i++) { re[rev[i]] = (x[at + i] || 0) * win[i]; im[rev[i]] = 0; }
  for (let size = 2; size <= N; size <<= 1) {
    const half = size >> 1, step = N / size;
    for (let st = 0; st < N; st += size) for (let j = 0; j < half; j++) {
      const k = j * step, a = st + j, b = a + half;
      const tr = re[b] * cos[k] - im[b] * sin[k], ti = re[b] * sin[k] + im[b] * cos[k];
      re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
    }
  }
}
/** Chroma-reeks van x (sr Hz), één vector van 12 per 1/rate s; plat in een Float32Array (frames*12). */
function chromaSeq(x, sr, rate, frames) {
  const hop = sr / rate, out = new Float32Array(frames * 12), re = new Float64Array(FFTN), im = new Float64Array(FFTN);
  const pcs = new Int8Array(FFTN / 2).fill(-1);
  for (let k = 1; k < FFTN / 2; k++) { const f = (k * sr) / FFTN; if (f >= 60 && f <= 2500) pcs[k] = ((Math.round(12 * Math.log2(f / 440)) % 12) + 12 + 9) % 12; }
  for (let fr = 0; fr < frames; fr++) {
    fftMag(x, Math.round(fr * hop), re, im);
    const v = out.subarray(fr * 12, fr * 12 + 12);
    for (let k = 1; k < FFTN / 2; k++) if (pcs[k] >= 0) v[pcs[k]] += Math.sqrt(re[k] * re[k] + im[k] * im[k]);
    let m = 0; for (let c = 0; c < 12; c++) m += v[c]; m /= 12;
    let nn = 0; for (let c = 0; c < 12; c++) { v[c] -= m; nn += v[c] * v[c]; }
    nn = Math.sqrt(nn);
    if (m < 1e-3 || nn < 1e-9) v.fill(0); else for (let c = 0; c < 12; c++) v[c] /= nn;
  }
  return out;
}
/** Beste verschuiving van chroma-reeks x t.o.v. e (gewogen naar het midden). */
function bestLagChroma(e, n, x, maxL) {
  const w = new Float32Array(n);
  for (let i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * (i + 0.5)) / n);
  let best = 0, bestSc = -Infinity;
  for (let l = -maxL; l <= maxL; l++) {
    let dot = 0, ws = 0;
    for (let i = 0; i < n; i++) {
      const a = i * 12, b = (i + l + maxL) * 12;
      if (e[a] === 0 && e[a + 1] === 0 && e[a + 2] === 0) continue;   // stilte in de edit telt niet mee
      let d = 0; for (let c = 0; c < 12; c++) d += e[a + c] * (x[b + c] || 0);
      dot += w[i] * d; ws += w[i];
    }
    const sc = ws > 0 ? dot / ws : -Infinity;
    if (sc > bestSc) { bestSc = sc; best = l; }
  }
  return { lag: best, score: bestSc };
}

function smoothCurve(x, sigma) {
  if (sigma < 0.5) return x;
  const r = Math.ceil(sigma * 3), k = [];
  let ks = 0; for (let i = -r; i <= r; i++) { const v = Math.exp(-(i * i) / (2 * sigma * sigma)); k.push(v); ks += v; }
  const out = new Float32Array(x.length);
  for (let i = 0; i < x.length; i++) { let v = 0; for (let j = -r; j <= r; j++) { const q = i + j; if (q >= 0 && q < x.length) v += x[q] * k[j + r]; } out[i] = v / ks; }
  return out;
}
/**
 * Beste verschuiving (in frames) van x t.o.v. e, gewogen naar het midden van e (Hann-venster),
 * zodat een tempoverschil aan de randen weinig uitmaakt. x is e.length + 2*maxL lang.
 */
function bestLag(e, x, maxL, lo = -maxL, hi = maxL) {
  const n = e.length, w = new Float32Array(n);
  let ee = 0;
  for (let i = 0; i < n; i++) { w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * (i + 0.5)) / n); ee += w[i] * e[i] * e[i]; }
  let best = 0, bestSc = -Infinity;
  for (let l = lo; l <= hi; l++) {
    let dot = 0, ex = 0;
    const o = l + maxL;
    for (let i = 0; i < n; i++) { const y = x[i + o] || 0; dot += w[i] * e[i] * y; ex += w[i] * y * y; }
    const sc = ex > 1e-12 && ee > 1e-12 ? dot / Math.sqrt(ee * ex) : -Infinity;
    if (sc > bestSc) { bestSc = sc; best = l; }
  }
  return { lag: best, score: bestSc };
}

/**
 * Kenmerken van wat de edit rond tijd t laat horen, om takes daarop lokaal uit te lijnen.
 * Grof op de noten (toonhoogteprofiel, venster 6 s, midden telt zwaarst), fijn op de inzetten (venster 1 s).
 */
const AL_W = 3, AL_WF = 0.5, AL_RATE = 200, AL_SR = 8000;
function editFeatures(t) {
  const W = AL_W, Wf = AL_WF, rate = AL_RATE, sr = AL_SR;
  if (!S.clips.some((c) => c.start < t + W && end(c) > t - W)) return null;
  const editOn = onsetCurve(renderMono(t - W - 0.2, t + W + 0.2, sr), sr, rate);
  const n = Math.round(2 * W * rate), nf = Math.round(2 * Wf * rate), off = Math.round(0.2 * rate);
  const NF = FFTN / sr;
  const f = {
    t, n, nf, NF,
    chroma: chromaSeq(renderMono(t - W - NF / 2, t + W + NF / 2, sr), sr, rate, n),
    coarse: smoothCurve(editOn, 8).subarray(off, off + n),
    fine: smoothCurve(editOn, 1.6).subarray(off + Math.round((W - Wf) * rate), off + Math.round((W - Wf) * rate) + nf),
  };
  let ee = 0; for (const v of f.coarse) ee += v * v;
  return ee < 1e-12 ? null : f;
}
/** Sync waarbij dezelfde passage van 'take' onder tijd f.t ligt (zoekend tot ±R s rond de huidige sync), of null. */
function matchTake(f, take, R = 8) {
  const W = AL_W, Wf = AL_WF, rate = AL_RATE, sr = AL_SR;
  const s0 = f.t - take.sync, maxL = Math.round(R * rate);
  const raw = onsetCurve(takeMono(take, s0 - W - R, s0 + W + R, sr), sr, rate);
  const xChroma = chromaSeq(takeMono(take, s0 - W - R - f.NF / 2, s0 + W + R + f.NF / 2, sr), sr, rate, f.n + 2 * maxL);
  let coarse = bestLagChroma(f.chroma, f.n, xChroma, maxL);
  if (coarse.score < 0.3) coarse = bestLag(f.coarse, smoothCurve(raw, 8), maxL);   // bijv. slagwerk zonder toonhoogte
  if (coarse.score < 0.25) return null;
  const xf = smoothCurve(raw, 1.6), fl = Math.round(0.15 * rate), base = Math.round((W - Wf) * rate);
  const xs = new Float32Array(f.nf + 2 * maxL);
  for (let i = 0; i < xs.length; i++) xs[i] = xf[i + base] || 0;
  const fine = bestLag(f.fine, xs, maxL, coarse.lag - fl, coarse.lag + fl);
  const lag = fine.score > 0.2 ? fine.lag : coarse.lag;
  return take.sync - lag / rate;
}

/** H: lijn alle takes lokaal uit op de edit rond de afspeelkop. Alleen de take-banen verschuiven. */
function alignTakesHere(t = S.playhead) {
  const f = editFeatures(t);
  if (!f) { toast('Er klinkt rond de afspeelkop niets in de edit om op uit te lijnen'); return; }
  const res = [];
  pushUndo();
  for (const take of S.takes) {
    const ns = matchTake(f, take);
    if (ns == null) { res.push(`${take.name}: niet gevonden`); continue; }
    const d = ns - take.sync;
    take.sync = ns;
    res.push(`${take.name} ${Math.abs(d) < 0.003 ? 'klopte al' : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2) + ' s'}`);
  }
  afterEdit();
  toast('Takes uitgelijnd rond ' + fmt(t, 1) + ': ' + res.join(' · '));
}

/** Waar in 'take' hoort tijd t van de edit bij? Eerst automatisch zoeken, anders de huidige ligging van de baan. */
function sourcePosFor(take, t) {
  const f = editFeatures(t);
  const ns = f ? matchTake(f, take) : null;
  return { s: t - (ns == null ? take.sync : ns), found: ns != null };
}

/** Overnemen: vanaf doelpunt d verder met take vanaf bronpositie s; alles na d wordt vervangen. */
function assembleEdit(take, d, s) {
  if (s < 0 || s > take.buffer.duration - 0.05) { toast('Het bronpunt ligt buiten de take'); return; }
  const later = S.clips.filter((c) => c.start > d + 0.001).length;
  mutate(() => {
    const out = [];
    for (const c of S.clips) {
      if (end(c) <= d + 1e-9) out.push(c);
      else if (c.start < d) out.push({ ...c, dur: d - c.start, fadeOut: 0.005 });
    }
    const nc = newClip(take, d, s, take.buffer.duration - s);
    out.push(nc);
    S.clips = out; normalize();
    autoXfades(nc);
    take.sync = d - s;                                   // take-baan ligt nu gelijk met de edit op dit punt
    const j = junctions().find((x) => x.b.id === nc.id);
    S.sel = j ? { kind: 'junction', a: j.a.id, b: j.b.id } : { kind: 'clip', id: nc.id };
    clearPoints();
    S.playhead = d;
  });
  toast(`Vanaf ${fmt(d, 1)} verder met "${take.name}"${later ? ` (${later} latere clip${later === 1 ? '' : 's'} vervangen — ⌘Z maakt ongedaan)` : ''}. Stel de overgang hieronder fijn af.`);
}

/**
 * Vervangen (4-punts-edit): [din,dout] in de edit wordt [sin,sout] uit 'take', met crossfades aan beide kanten.
 * Is het nieuwe stuk langer of korter, dan schuift alles erna dat verschil op; de rest blijft intact.
 */
function patchEdit(take, din, dout, sin, sout) {
  const len = take.buffer.duration;
  if (sin < 0 || sout > len || sout - sin < 0.02) { toast('Het stuk in de take valt (deels) buiten de opname'); return; }
  const delta = (sout - sin) - (dout - din);
  mutate(() => {
    const out = [];
    for (const c of S.clips) {
      const ce = end(c);
      if (ce <= din + 1e-9) { out.push(c); continue; }
      if (c.start >= dout - 1e-9) { out.push({ ...c, start: c.start + delta }); continue; }
      if (c.start < din) out.push({ ...c, dur: din - c.start, fadeOut: 0.005 });
      if (ce > dout) out.push({ ...c, id: c.start < din ? newId() : c.id, start: dout + delta, offset: c.offset + (dout - c.start), dur: ce - dout, fadeIn: 0.005, xShape: 'eqp' });
    }
    const nc = newClip(take, din, sin, sout - sin);
    out.push(nc);
    S.clips = out;
    for (const mk of S.markers) if (mk.t >= dout - 1e-9) mk.t += delta;
    normalize();
    autoXfades(nc);
    take.sync = din - sin;
    const j = junctions().find((x) => x.b.id === nc.id);
    S.sel = j ? { kind: 'junction', a: j.a.id, b: j.b.id } : { kind: 'clip', id: nc.id };
    clearPoints();
    S.playhead = Math.max(0, din - S.preroll);
  });
  const dms = Math.round(delta * 1000);
  toast(`${fmt(din, 2)} – ${fmt(dout, 2)} vervangen door "${take.name}"${dms ? ` (${Math.abs(dms)} ms ${dms > 0 ? 'langer' : 'korter'}; de rest schuift mee)` : ''}. L herhaalt de wissel, ⌘Z maakt ongedaan.`);
}

/** E: selectie uit een take overnemen, of overnemen/vervangen met doel- en bronpunten. */
function editAction() {
  if (S.range) { compRange(); return; }
  const P = S.pts, d = P.dest, dOut = P.destOut;
  if (d == null) { toast('Zet eerst Doel in (D) — of sleep in de tijdbalk over het stuk dat je wilt vervangen — of selecteer een stuk in een take'); return; }
  let take, sIn, notFound = false;
  if (P.src) { take = takeOf(P.src.takeId); sIn = P.src.s; }
  else {
    take = sourceTakeContext();
    if (!take) { toast('Kies een take: klik op de naam of in de baan van de take (of zet een bronpunt met B)'); return; }
    busy(true, 'Dezelfde plek in de take zoeken…');
    const r = sourcePosFor(take, d); sIn = r.s; notFound = !r.found;
  }
  if (S.playing) stop();
  if (dOut == null) { busy(false); assembleEdit(take, d, sIn); }
  else {
    let sOut;
    if (P.srcOut != null && P.src && P.src.takeId === take.id) sOut = P.srcOut;
    else {
      busy(true, 'Het eind van het stuk in de take zoeken…');
      // zoek het eind ten opzichte van het gevonden begin (zo verschuift de zoekruimte mee)
      const tmp = take.sync; take.sync = d - sIn;
      const r = sourcePosFor(take, dOut); sOut = r.s; notFound = notFound || !r.found;
      take.sync = tmp;
    }
    busy(false);
    patchEdit(take, d, dOut, sIn, sOut);
  }
  if (notFound) setTimeout(() => toast('Let op: de bijbehorende plek in de take kon niet zeker worden gevonden. Controleer de wissel, of zet zelf B (en ⇧B).'), 2800);
}

/* ---------- markers + herhalen ---------- */
const sortedMarkers = () => [...S.markers].sort((a, b) => a.t - b.t);
function ensureVisible(t) {
  if (px(t) < 0 || px(t) > cssW - 20) { S.view = Math.max(0, t - (cssW / S.pps) * 0.2); updateScroll(); }
  S.dirty = true;
}
/** Marker op de afspeelkop. Tijdens het afspelen loopt het afspelen gewoon door. */
function addMarker(t = S.playhead) {
  if (S.markers.some((m) => Math.abs(m.t - t) < 0.05)) { toast('Hier staat al een marker'); return; }
  pushUndo();
  const mk = { id: newId(), t: Math.max(0, t), text: '' };
  S.markers.push(mk);
  const nr = sortedMarkers().indexOf(mk) + 1;
  S.dirty = true; updateButtons(); scheduleSave();
  if (S.playing) toast(`Marker ${nr} op ${fmt(mk.t, 1)} — geef hem later een notitie`);
  else select({ kind: 'marker', id: mk.id });
}
function jumpMarker(dir) {
  const list = sortedMarkers();
  if (!list.length) { toast('Nog geen markers. Druk M om er een te zetten.'); return; }
  const tol = S.playing ? 0.4 : 0.01;
  const mk = dir > 0 ? list.find((m) => m.t > S.playhead + 0.01) : [...list].reverse().find((m) => m.t < S.playhead - tol);
  if (!mk) { toast(dir > 0 ? 'Geen marker meer verderop' : 'Geen marker meer hiervoor'); return; }
  S.playhead = mk.t; ensureVisible(mk.t);
  if (S.playing) restartAtPlayhead(); else select({ kind: 'marker', id: mk.id });
}
function toggleLoop() {
  if (S.playing && S.playing.loop) { stop(); renderInspector(); return; }
  const s = S.sel;
  let a, b;
  if (s && s.kind === 'erange') { a = Math.min(s.t0, s.t1); b = Math.max(s.t0, s.t1); }
  else if (s && s.kind === 'junction') { const j = junctionOf(s.a, s.b); if (j) { a = Math.max(0, j.s - S.preroll); b = j.e + S.preroll; } }
  if (a == null) { toast('Sleep eerst in de tijdbalk over een stuk (of klik een crossfade aan) om dat te herhalen'); return; }
  play(a, b, [a, b]);
  renderInspector();
}
function inspectMarker(el, mk) {
  const list = sortedMarkers(), nr = list.indexOf(mk) + 1;
  el.innerHTML = `
    <div class="insp-head"><h2>Marker ${nr}</h2><span>${fmt(mk.t)}</span></div>
    <div class="row">
      <label>Notitie <input type="text" id="mkText" value="${esc(mk.text)}" placeholder="bijv. take 2 beter vanaf hier" style="width:320px"></label>
      <button id="mkPlay">▶ Speel vanaf hier</button>
      <button id="mkDel" class="danger">Verwijder <kbd>Delete</kbd></button>
    </div>
    <div class="plist">${list.map((m, i) => `
      <div class="pitem${m.id === mk.id ? ' cur' : ''}">
        <span class="pname">${i + 1}. ${fmt(m.t, 1)}</span>
        <span class="pmeta">${m.text ? esc(m.text) : '—'}</span>
        <button data-mk="${m.id}">Ga naar</button>
      </div>`).join('')}</div>
    <p class="hint"><kbd>M</kbd> zet een marker op de afspeelkop, ook tijdens het afspelen · <kbd>,</kbd> en <kbd>.</kbd> springen naar de vorige/volgende marker · sleep een marker in de tijdbalk om hem te verplaatsen.</p>`;
  $('mkText').onchange = (e) => { pushUndo(); mk.text = e.target.value.trim(); S.dirty = true; scheduleSave(); renderInspector(); };
  $('mkText').onkeydown = (e) => { if (e.key === 'Enter') e.target.blur(); };
  $('mkPlay').onclick = () => { S.playhead = mk.t; play(mk.t); };
  $('mkDel').onclick = () => deleteSelection();
  el.querySelectorAll('[data-mk]').forEach((b) => {
    b.onclick = () => { const m = S.markers.find((x) => x.id === +b.dataset.mk); S.playhead = m.t; ensureVisible(m.t); select({ kind: 'marker', id: m.id }); if (S.playing) restartAtPlayhead(); };
  });
}

/* ---------- uitlijnvenster ----------
   Twee bronnen (twee takes, of de twee clips van een crossfade) onder elkaar en over elkaar,
   met een eigen zoom tot op sample-niveau. B verschuift: bij takes de sync (clips in de edit
   schuiven mee), bij een crossfade de inhoud van clip B (slip). */

/** Verschuif de sync van een take; clips uit die take in de edit houden dezelfde muziek op dezelfde plek. */
function setTakeSync(t, ns) {
  const dt = ns - t.sync;
  t.sync = ns;
  if (!S.syncClips || !dt) return;
  const len = t.buffer.duration;
  for (const c of S.clips) if (c.takeId === t.id) c.offset = clamp(c.offset - dt, 0, Math.max(0, len - c.dur));
}

function alignSrc(s, which) {
  const id = s[which];
  if (s.mode === 'takes') { const t = takeOf(id); return t ? { take: t, base: t.sync } : null; }
  const c = clipOf(id); if (!c) return null;
  return { take: takeOf(c.takeId), base: c.start - c.offset, clip: c };
}

function sampleAt(take, st) {
  const sr = take.buffer.sampleRate, x = st * sr, i = Math.floor(x), f = x - i, d = take.data;
  if (i < 0 || i + 1 >= d[0].length) return 0;
  let a = 0, b = 0;
  for (const ch of d) { a += ch[i]; b += ch[i + 1]; }
  return (a + (b - a) * f) / d.length;
}

function openAlign() {
  const s = S.sel, W = Math.max(300, cssW);
  let al = null;
  if (s && s.kind === 'junction') {
    const j = junctionOf(s.a, s.b);
    if (j) { const c = (j.s + j.e) / 2, span = Math.max(0.05, (j.e - j.s) * 1.5); al = { mode: 'clips', a: j.a.id, b: j.b.id, t0: c - span / 2, spx: span / W }; }
  }
  if (!al) {
    if (S.takes.length < 2) { toast('Voor uitlijnen zijn minstens twee takes nodig'); return; }
    // B = de geselecteerde take (die verschuift); A = de take die in de edit onder de afspeelkop klinkt.
    const under = S.clips.find((c) => c.start <= S.playhead && end(c) > S.playhead);
    const b = s && s.kind === 'take' ? s.id : S.takes[S.takes.length - 1].id;
    const a = under && under.takeId !== b ? under.takeId : S.takes.find((t) => t.id !== b).id;
    al = { mode: 'takes', a, b, t0: S.playhead - 0.1, spx: 0.2 / W };
  }
  select({ kind: 'align', gain: 1, ...al });
}

function alignOffset(s) {
  const A = alignSrc(s, 'a'), B = alignSrc(s, 'b');
  return A && B ? B.base - A.base : 0;
}
function updateAlignInfo() {
  const el = $('alOff'), s = S.sel;
  if (!el || !s || s.kind !== 'align') return;
  const d = alignOffset(s), sr = alignSrc(s, 'a').take.buffer.sampleRate;
  el.textContent = s.mode === 'takes'
    ? `B staat ${d >= 0 ? '+' : '−'}${Math.abs(d * 1000).toFixed(3)} ms (${Math.round(Math.abs(d) * sr)} samples) ${d >= 0 ? 'later' : 'eerder'} dan A`
    : `Inhoud van B verschoven: ${d >= 0 ? '+' : '−'}${Math.abs(d * 1000).toFixed(3)} ms t.o.v. A`;
}

function nudgeAlign(dt) {
  const s = S.sel; if (!s || s.kind !== 'align') return;
  const B = alignSrc(s, 'b'); if (!B) return;
  mutate(() => {
    if (s.mode === 'takes') setTakeSync(B.take, B.take.sync + dt);
    else B.clip.offset = clamp(B.clip.offset - dt, 0, Math.max(0, B.take.buffer.duration - B.clip.dur));
  });
}

/** Zoek binnen het beeld de verschuiving van B (max ±20 ms) waarbij de golfvormen het best overlappen. */
function alignFine() {
  const s = S.sel; if (!s || s.kind !== 'align') return;
  const A = alignSrc(s, 'a'), B = alignSrc(s, 'b'), sr = A.take.buffer.sampleRate;
  const W = $('alCanvas') ? $('alCanvas').clientWidth : cssW;
  const c = s.t0 + (W * s.spx) / 2, half = clamp((W * s.spx) / 2, 0.01, 0.25);
  const w0 = c - half, N = Math.round(2 * half * sr);
  const maxLag = Math.round(clamp(half, 0.002, 0.02) * sr);
  const a = new Float32Array(N), b = new Float32Array(N + 2 * maxLag);
  for (let k = 0; k < N; k++) a[k] = sampleAt(A.take, w0 + k / sr - A.base);
  for (let k = 0; k < b.length; k++) b[k] = sampleAt(B.take, w0 + (k - maxLag) / sr - B.base);
  let ea = 0; for (let k = 0; k < N; k++) ea += a[k] * a[k];
  if (ea < 1e-9) { toast('Te stil in beeld om uit te lijnen'); return; }
  let best = 0, bestScore = -Infinity;
  for (let lag = -maxLag; lag <= maxLag; lag++) {
    let dot = 0, eb = 0;
    const o = lag + maxLag;
    for (let k = 0; k < N; k++) { const y = b[k + o]; dot += a[k] * y; eb += y * y; }
    const sc = eb > 1e-12 ? dot / Math.sqrt(ea * eb) : -Infinity;
    if (sc > bestScore) { bestScore = sc; best = lag; }
  }
  nudgeAlign(-best / sr);
  toast(`B ${best > 0 ? 'eerder' : best < 0 ? 'later' : 'niet'} gezet${best ? ': ' + (Math.abs(best) / sr * 1000).toFixed(3) + ' ms' : ''} · overeenkomst ${(bestScore * 100).toFixed(0)}%`);
}

function playAlign(which) {
  const s = S.sel; if (!s || s.kind !== 'align') return;
  stopSources();
  const ac = ensureAC(); if (ac.state !== 'running') ac.resume();
  const list = (which === 'ab' ? ['a', 'b'] : [which]).map((w) => alignSrc(s, w)).filter(Boolean);
  const from = Math.max(Math.min(...list.map((x) => x.base)), s.t0 - 0.5);
  const to = Math.max(...list.map((x) => x.base + x.take.buffer.duration));
  const when = ac.currentTime + 0.06, srcs = [];
  for (const x of list) {
    const src = ac.createBufferSource(); src.buffer = x.take.buffer;
    const gn = ac.createGain(); gn.gain.value = which === 'ab' ? 0.6 : 1;
    src.connect(gn); gn.connect(S.master);
    src.start(when + Math.max(0, x.base - from), Math.max(0, from - x.base));
    srcs.push(src);
  }
  S.playing = { mode: 'align', srcs, from, to, when, loop: null, start: S.playhead };
  S.playhead = from;
  updatePlayBtn();
}

const AL = { RULER: 18, ROW: 88, OVER: 128 };
function alignRows() {
  const a = AL.RULER + 4, b = a + AL.ROW + 6, o = b + AL.ROW + 6;
  return { a, b, o, h: o + AL.OVER + 4 };
}

function drawAlignTrack(g, src, y, h, W, s, color, alpha) {
  const mid = y + h / 2, half = h / 2 - 4, take = src.take, sr = take.buffer.sampleRate, sppS = s.spx * sr, dur = take.buffer.duration;
  g.globalAlpha = alpha;
  if (sppS < 5) {
    g.strokeStyle = color; g.lineWidth = 1.6; g.beginPath();
    let on = false;
    for (let x = 0; x <= W; x++) {
      const st = s.t0 + x * s.spx - src.base;
      if (st < 0 || st > dur) { on = false; continue; }
      const yy = mid - clamp(sampleAt(take, st) * s.gain, -1, 1) * half;
      if (on) g.lineTo(x, yy); else { g.moveTo(x, yy); on = true; }
    }
    g.stroke();
    if (sppS < 0.25) {                       // ver ingezoomd: elk sample als puntje
      g.fillStyle = color;
      const k0 = Math.ceil((s.t0 - src.base) * sr), k1 = Math.floor((s.t0 + W * s.spx - src.base) * sr);
      for (let k = Math.max(0, k0); k <= k1 && k < take.data[0].length; k++) {
        let v = 0; for (const ch of take.data) v += ch[k]; v /= take.data.length;
        const x = (k / sr + src.base - s.t0) / s.spx;
        g.fillRect(x - 1.5, mid - clamp(v * s.gain, -1, 1) * half - 1.5, 3, 3);
      }
    }
  } else if (sppS < PEAK_BLOCK) {
    // echte min/max per pixel (zonder de nullijn mee te nemen), zodat de golfvorm niet blokkerig wordt
    g.fillStyle = color;
    const d = take.data, n = d[0].length, nc = d.length;
    for (let x = 0; x < W; x++) {
      const a = Math.max(0, Math.floor((s.t0 + x * s.spx - src.base) * sr));
      const b = Math.min(n, Math.ceil((s.t0 + (x + 1) * s.spx - src.base) * sr) + 1);
      if (b <= a) continue;
      let lo = Infinity, hi = -Infinity;
      for (let k = a; k < b; k++) { let v = 0; for (const ch of d) v += ch[k]; v /= nc; if (v < lo) lo = v; if (v > hi) hi = v; }
      lo = clamp(lo * s.gain, -1, 1); hi = clamp(hi * s.gain, -1, 1);
      g.fillRect(x, mid - hi * half, 1, Math.max(1, (hi - lo) * half));
    }
  } else {
    g.fillStyle = color;
    drawWave(g, take, src.base, 0, W, (x) => s.t0 + x * s.spx, s.spx, mid, half, () => s.gain);
  }
  g.globalAlpha = 1;
}

function drawAlign() {
  const c = $('alCanvas'), s = S.sel;
  if (!c || !s || s.kind !== 'align') return;
  const A = alignSrc(s, 'a'), B = alignSrc(s, 'b');
  if (!A || !B) return;
  const W = c.clientWidth, R = alignRows(), H = R.h;
  if (c.style.height !== H + 'px') c.style.height = H + 'px';
  if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const xOf = (t) => (t - s.t0) / s.spx;
  // liniaal
  const raw = 90 * s.spx, p10 = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map((m) => m * p10).find((v) => v >= raw);
  const dec = clamp(Math.ceil(-Math.log10(step)), 0, 6);
  g.font = '10px ui-monospace, Menlo, monospace'; g.textBaseline = 'top';
  for (let t = Math.ceil(s.t0 / step) * step; t < s.t0 + W * s.spx; t += step) {
    const x = Math.round(xOf(t)) + 0.5;
    g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(x, AL.RULER, 1, H - AL.RULER);
    g.fillStyle = '#8b93a1'; g.fillText(fmt(t, Math.max(3, dec)), x + 3, 3);
  }
  const rows = [[R.a, AL.ROW, 'A · ' + A.take.name, A], [R.b, AL.ROW, 'B · ' + B.take.name, B], [R.o, AL.OVER, 'A + B over elkaar', null]];
  for (const [y, h, label, src] of rows) {
    g.fillStyle = '#14171c'; g.fillRect(0, y, W, h);
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(0, y + h / 2, W, 1);
    if (src && src.clip) {                                   // buiten de clip: gedimd
      g.fillStyle = 'rgba(255,255,255,0.05)';
      const x0 = clamp(xOf(src.clip.start), 0, W), x1 = clamp(xOf(end(src.clip)), 0, W);
      g.fillRect(x0, y, x1 - x0, h);
    }
    if (src) drawAlignTrack(g, src, y, h, W, s, src.take.color, 1);
    else {
      drawAlignTrack(g, A, y, h, W, s, A.take.color, 0.75);
      drawAlignTrack(g, B, y, h, W, s, B.take.color === A.take.color ? '#ffffff' : B.take.color, 0.75);
    }
    g.fillStyle = '#c9ced8'; g.font = '11px system-ui, sans-serif'; g.textBaseline = 'top';
    g.fillText(label, 6, y + 4);
  }
  if (s.mode === 'clips') {
    const j = junctionOf(s.a, s.b);
    if (j) { g.fillStyle = 'rgba(255,211,42,0.7)'; g.fillRect(Math.round(xOf(j.s)), AL.RULER, 1, H); g.fillRect(Math.round(xOf(j.e)), AL.RULER, 1, H); }
  }
  const ph = xOf(S.playhead);
  if (ph >= 0 && ph <= W) { g.fillStyle = '#ff5c6c'; g.fillRect(Math.round(ph), 0, 1.5, H); }
  const sr = A.take.buffer.sampleRate;
  g.fillStyle = '#8b93a1'; g.textAlign = 'right'; g.textBaseline = 'bottom'; g.font = '10px system-ui, sans-serif';
  const span = W * s.spx;
  g.fillText(`beeld ${span < 1 ? (span * 1000).toFixed(span < 0.01 ? 2 : 0) + ' ms' : span.toFixed(2) + ' s'} · ${(1 / (s.spx * sr)).toFixed(s.spx * sr < 1 ? 1 : 3)} px per sample`, W - 6, H - 4);
  g.textAlign = 'left';
}

function zoomAlign(x, f) {
  const s = S.sel; if (!s || s.kind !== 'align') return;
  const A = alignSrc(s, 'a'); if (!A) return;
  const W = $('alCanvas').clientWidth, sr = A.take.buffer.sampleRate;
  const t = s.t0 + x * s.spx;
  s.spx = clamp(s.spx / f, 1 / (sr * 40), Math.max(1, contentEnd()) / W);
  s.t0 = t - x * s.spx;
  drawAlign();
}

function bindAlignCanvas() {
  const c = $('alCanvas');
  let drag = null;
  const rowAt = (y) => { const R = alignRows(); return y < R.b - 3 ? 'a' : 'b'; };
  c.addEventListener('pointerdown', (e) => {
    const s = S.sel; if (!s || s.kind !== 'align') return;
    const r = c.getBoundingClientRect(), y = e.clientY - r.top;
    const B = alignSrc(s, 'b'); if (!B) return;
    c.setPointerCapture(e.pointerId);
    drag = { kind: rowAt(y) === 'a' ? 'pan' : 'shift', x0: e.clientX, t00: s.t0, moved: false, xr: e.clientX - r.left,
      orig: s.mode === 'takes' ? B.take.sync : B.clip.offset };
  });
  c.addEventListener('pointermove', (e) => {
    const s = S.sel;
    if (!drag) { const r = c.getBoundingClientRect(); c.style.cursor = rowAt(e.clientY - r.top) === 'a' ? 'grab' : 'ew-resize'; return; }
    const dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dx) < 2) return;
    if (!drag.moved) { drag.moved = true; if (drag.kind === 'shift') pushUndo(); }
    if (drag.kind === 'pan') s.t0 = drag.t00 - dx * s.spx;
    else {
      const B = alignSrc(s, 'b'), dt = dx * s.spx;
      if (s.mode === 'takes') B.take.sync = drag.orig + dt;
      else B.clip.offset = clamp(drag.orig - dt, 0, Math.max(0, B.take.buffer.duration - B.clip.dur));
      S.dirty = true; updateAlignInfo();
    }
    drawAlign();
  });
  const up = () => {
    const d = drag; drag = null; if (!d) return;
    const s = S.sel; if (!s || s.kind !== 'align') return;
    if (d.kind === 'shift' && d.moved) {
      if (s.mode === 'takes') { const t = alignSrc(s, 'b').take, ns = t.sync; t.sync = d.orig; setTakeSync(t, ns); }
      afterEdit();
    } else if (!d.moved) { S.playhead = s.t0 + d.xr * s.spx; drawAlign(); }
  };
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);
  c.addEventListener('wheel', (e) => {
    const s = S.sel; if (!s || s.kind !== 'align') return;
    const r = c.getBoundingClientRect(), x = e.clientX - r.left;
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomAlign(x, Math.exp(-e.deltaY * 0.0025)); }
    else if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      e.preventDefault(); s.t0 += (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * s.spx; drawAlign();
    }
  }, { passive: false });
  let gs = 1;
  c.addEventListener('gesturestart', (e) => { e.preventDefault(); gs = 1; });
  c.addEventListener('gesturechange', (e) => { e.preventDefault(); const r = c.getBoundingClientRect(); zoomAlign(e.clientX - r.left, e.scale / gs); gs = e.scale; });
  c.addEventListener('gestureend', (e) => e.preventDefault());
}

function inspectAlign(el, s) {
  const A = alignSrc(s, 'a'), B = alignSrc(s, 'b');
  const opts = (sel) => S.takes.map((t) => `<option value="${t.id}"${t.id === sel ? ' selected' : ''}>${esc(t.name)}</option>`).join('');
  el.innerHTML = `
    <div class="insp-head"><h2>Uitlijnen</h2><span>${s.mode === 'takes'
      ? 'Takes t.o.v. elkaar verschuiven'
      : `Crossfade ${esc(A.take.name)} → ${esc(B.take.name)}: de inhoud van clip B verschuift (slip)`}</span></div>
    ${s.mode === 'takes' ? `<div class="row">
      <label>A (referentie) <select id="alA">${opts(s.a)}</select></label>
      <label>B (verschuiven) <select id="alB">${opts(s.b)}</select></label>
      <label title="Clips uit take B die al in de edit staan, houden dezelfde muziek op dezelfde plek"><input type="checkbox" id="alFollow"${S.syncClips ? ' checked' : ''}> Clips in de edit schuiven mee</label>
    </div>` : ''}
    <canvas id="alCanvas"></canvas>
    <div class="row">
      <span class="group">Zoom <button id="alZo">−</button><button id="alZi">+</button><button id="alZs" title="Zo ver inzoomen dat je losse samples ziet">Samples</button></span>
      <label>Hoogte <select id="alGain">${[1, 2, 4, 8, 16, 32].map((v) => `<option value="${v}"${v === s.gain ? ' selected' : ''}>${v}×</option>`).join('')}</select></label>
      <span class="group">B <button data-n="-0.01">−10 ms</button><button data-n="-0.001">−1 ms</button><button data-n="-1s">−1 sample</button><button data-n="1s">+1 sample</button><button data-n="0.001">+1 ms</button><button data-n="0.01">+10 ms</button></span>
    </div>
    <div class="row"><b id="alOff"></b></div>
    <div class="row">
      <button id="alFine" class="primary" title="Zoekt binnen wat je nu ziet (max ±20 ms) de beste overlap">Automatisch (in beeld)</button>
      ${s.mode === 'takes' ? '<button id="alCoarse" title="Zoekt over de hele take (max ±10 s) waar de inzetten overeenkomen">Automatisch (hele take, grof)</button>' : ''}
      <span class="group"><button id="alPA">▶ A</button><button id="alPB">▶ B</button><button id="alPAB" title="Beide tegelijk: hoe beter uitgelijnd, hoe voller en minder zwiepend het klinkt">▶ A + B samen</button></span>
      <button id="alClose">Sluiten</button>
    </div>
    <p class="hint">Sleep in rij <b>B</b> of in de onderste rij om B te verschuiven. Sleep in rij <b>A</b> of veeg met twee vingers om door de tijd te schuiven; knijp (of ⌘ + twee vingers) om te zoomen. Pijltjes ←/→ verschuiven B 1 ms, met Shift 10 ms, met ⌥ 1 sample.${s.mode === 'clips' ? ' Lichte vlakken = het deel van de clip dat in de edit klinkt; gele lijnen = de crossfade.' : ''}</p>`;
  if (s.mode === 'takes') {
    const pick = (which, other) => (e) => {
      s[which] = +e.target.value;
      if (s[which] === s[other]) s[other] = S.takes.find((t) => t.id !== s[which]).id;
      renderInspector();
    };
    $('alA').onchange = pick('a', 'b');
    $('alB').onchange = pick('b', 'a');
    $('alFollow').onchange = (e) => { S.syncClips = e.target.checked; saveSettings(); };
    $('alCoarse').onclick = () => { busy(true, 'Uitlijnen…'); setTimeout(() => { try { autoSync(B.take, A.take); } finally { busy(false); } }, 30); };
  }
  const cvW = () => $('alCanvas').clientWidth;
  $('alZo').onclick = () => zoomAlign(cvW() / 2, 1 / 2);
  $('alZi').onclick = () => zoomAlign(cvW() / 2, 2);
  $('alZs').onclick = () => zoomAlign(cvW() / 2, s.spx * A.take.buffer.sampleRate * 8);
  $('alGain').onchange = (e) => { s.gain = +e.target.value; drawAlign(); };
  const sr = A.take.buffer.sampleRate;
  el.querySelectorAll('[data-n]').forEach((b) => {
    b.onclick = () => { const v = b.dataset.n; nudgeAlign(v.endsWith('s') ? parseFloat(v) / sr : +v); };
  });
  $('alFine').onclick = alignFine;
  $('alPA').onclick = () => playAlign('a');
  $('alPB').onclick = () => playAlign('b');
  $('alPAB').onclick = () => playAlign('ab');
  $('alClose').onclick = () => select(null);
  bindAlignCanvas();
  updateAlignInfo();
  requestAnimationFrame(drawAlign);
}

/* ---------- interactie tijdlijn ---------- */
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function laneAt(y) {
  if (y < RULER) return { kind: 'ruler' };
  if (y < RULER + EDIT_H) return { kind: 'edit' };
  const k = Math.floor((y - RULER - EDIT_H) / TAKE_H);
  const t = S.takes[k];
  return t ? { kind: 'take', take: t } : { kind: 'none' };
}
function hitEdit(x) {
  for (const j of junctions()) {
    const xs = px(j.s), xe = px(j.e);
    if (x >= xs - 5 && x <= xe + 5) return { type: 'junction', j };
  }
  for (let i = S.clips.length - 1; i >= 0; i--) {
    const c = S.clips[i], xs = px(c.start), xe = px(end(c));
    if (x >= xs - 4 && x <= xe + 4) {
      if (xe - xs > 16 && x - xs < 6) return { type: 'trimL', c };
      if (xe - xs > 16 && xe - x < 6) return { type: 'trimR', c };
      if (x >= xs && x <= xe) return { type: 'body', c };
    }
  }
  return null;
}
function snapT(t, exclude, shift) {
  if (!S.snap || shift) return t;
  const cands = [0, S.playhead];
  S.clips.forEach((c) => { if (c !== exclude) cands.push(c.start, end(c)); });
  let best = t, bd = 8 / S.pps;
  for (const c of cands) { const d = Math.abs(c - t); if (d < bd) { bd = d; best = c; } }
  return best;
}

cv.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  // Klikken in de tijdlijn haalt de cursor uit een invulveld, zodat sneltoetsen (⌘Z, spatie) weer werken.
  if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) document.activeElement.blur();
  const { x, y } = pos(e);
  cv.setPointerCapture(e.pointerId);
  const t = tAt(x), lane = laneAt(y);
  const d = { x0: x, moved: false, t0: t };
  const mHit = lane.kind === 'ruler' ? S.markers.find((m) => Math.abs(px(m.t) - x) < 7) : null;
  if (mHit) { d.type = 'marker'; d.m = mHit; d.ot = mHit.t; select({ kind: 'marker', id: mHit.id }); }
  else if (lane.kind === 'ruler' || (lane.kind === 'edit' && e.shiftKey)) { d.type = 'erange'; }  // slepen = selectie in de edit
  else if (lane.kind === 'none') { d.type = 'playhead'; S.playhead = Math.max(0, t); }
  else if (lane.kind === 'edit') {
    const h = hitEdit(x);
    if (!h) { d.type = 'pan'; d.view0 = S.view; select(null); }   // leeg vlak: slepen schuift het beeld, klikken zet de afspeelkop
    else if (h.type === 'junction') {
      d.type = e.altKey ? 'xflen' : 'roll'; d.a = h.j.a; d.b = h.j.b; d.oa = { ...h.j.a }; d.ob = { ...h.j.b }; d.len = h.j.len;
      select({ kind: 'junction', a: h.j.a.id, b: h.j.b.id });
    } else {
      d.type = h.type === 'body' ? (e.altKey ? 'slip' : 'move') : h.type;
      d.c = h.c; d.o = { ...h.c };
      if (!(S.sel && S.sel.kind === 'clip' && S.sel.id === h.c.id)) select({ kind: 'clip', id: h.c.id });
    }
  } else if (lane.kind === 'take') {
    d.take = lane.take;
    if (e.altKey) { d.type = 'sync'; d.os = lane.take.sync; }
    else d.type = 'range';
    if (!(S.sel && S.sel.kind === 'take' && S.sel.id === lane.take.id)) select({ kind: 'take', id: lane.take.id });
  }
  S.drag = d; S.dirty = true;
});

cv.addEventListener('pointermove', (e) => {
  const { x, y } = pos(e);
  const d = S.drag;
  if (!d || d.xf) { hoverCursor(x, y, e.altKey); return; }
  const dx = x - d.x0;
  if (!d.moved && Math.abs(dx) < 3) return;
  if (!d.moved) {
    d.moved = true;
    if (['move', 'slip', 'trimL', 'trimR', 'roll', 'xflen', 'sync', 'marker'].includes(d.type)) pushUndo();
  }
  const dt = dx / S.pps, sh = e.shiftKey;
  const c = d.c, o = d.o;
  switch (d.type) {
    case 'playhead': S.playhead = Math.max(0, tAt(x)); break;
    case 'marker':
      d.m.t = Math.max(0, snapT(d.ot + dt, null, sh));
      break;
    case 'erange': {
      const t0 = Math.max(0, snapT(d.t0, null, false)), t1 = Math.max(0, snapT(tAt(x), null, false));
      if (!S.sel || S.sel.kind !== 'erange') { S.sel = { kind: 'erange', t0, t1 }; S.range = null; }
      S.sel.t0 = t0; S.sel.t1 = t1;
      if (Math.abs(t1 - t0) > 0.02) { S.pts.dest = Math.min(t0, t1); S.pts.destOut = Math.max(t0, t1); }
      break;
    }
    case 'pan':
      S.view = Math.max(0, d.view0 - dx / S.pps);
      updateScroll();
      break;
    case 'move': {
      let ns = o.start + dt;
      const a = snapT(ns, c, sh), b = snapT(ns + o.dur, c, sh) - o.dur;
      ns = Math.abs(a - ns) <= Math.abs(b - ns) ? a : b;
      c.start = Math.max(0, ns);
      break;
    }
    case 'slip': {
      const len = takeOf(c.takeId).buffer.duration;
      c.offset = clamp(o.offset - dt, 0, len - c.dur);
      break;
    }
    case 'trimL': {
      let ns = snapT(o.start + dt, c, sh);
      ns = clamp(ns, Math.max(0, o.start - o.offset), end(o) - MIN_DUR);
      c.start = ns; c.offset = o.offset + (ns - o.start); c.dur = end(o) - ns;
      break;
    }
    case 'trimR': {
      const len = takeOf(c.takeId).buffer.duration;
      let ne = snapT(end(o) + dt, c, sh);
      ne = clamp(ne, o.start + MIN_DUR, o.start + (len - o.offset));
      c.dur = ne - o.start;
      break;
    }
    case 'roll':
      Object.assign(d.a, d.oa); Object.assign(d.b, d.ob);
      roll(d.a, d.b, dt);
      break;
    case 'xflen':
      Object.assign(d.a, d.oa); Object.assign(d.b, d.ob);
      setXfLen(d.a, d.b, Math.max(0, d.len + 2 * dt));
      break;
    case 'range': {
      const tk = d.take;
      const lo = tk.sync, hi = tk.sync + tk.buffer.duration;
      S.range = { takeId: tk.id, t0: clamp(d.t0, lo, hi), t1: clamp(tAt(x), lo, hi) };
      break;
    }
    case 'sync': {
      let ns = d.os + dt;
      if (S.snap && !sh && Math.abs(ns) < 8 / S.pps) ns = 0;
      d.take.sync = ns;
      break;
    }
  }
  S.dirty = true;
  if (S.sel && S.sel.kind === 'junction') drawXf();
});

function endDrag(e) {
  const d = S.drag;
  if (!d || d.xf) return;
  S.drag = null;
  if (d.type === 'pan') {
    if (!d.moved) {
      S.playhead = Math.max(0, d.t0);
      if (gapAt(d.t0)) select({ kind: 'gap', t: d.t0 });
      if (S.playing) restartAtPlayhead();
    }
    S.dirty = true;
    return;
  }
  if (d.type === 'marker') {
    if (d.moved) afterEdit();
    else { S.playhead = d.m.t; if (S.playing) restartAtPlayhead(); renderInspector(); }
    S.dirty = true;
    return;
  }
  if (d.type === 'erange') {
    const s = S.sel;
    if (!d.moved || !s || s.kind !== 'erange' || Math.abs(s.t1 - s.t0) < 0.01) {
      if (s && s.kind === 'erange') S.sel = null;
      if (!d.moved) { S.playhead = Math.max(0, d.t0); if (S.playing) restartAtPlayhead(); }
    }
    S.dirty = true; buildHeads(); renderInspector(); updateButtons();
    return;
  }
  if (!d.moved) {
    if (['move', 'slip', 'trimL', 'trimR', 'range'].includes(d.type)) S.playhead = Math.max(0, d.t0);
    if (d.type === 'range') { S.range = null; renderInspector(); updateButtons(); }
    if (S.playing && d.type !== 'roll' && d.type !== 'xflen') restartAtPlayhead();
  } else if (d.type === 'range') {
    if (S.range && Math.abs(S.range.t1 - S.range.t0) < 0.01) S.range = null;
    renderInspector(); updateButtons();
  } else if (d.type === 'playhead') {
    if (S.playing) restartAtPlayhead();
  } else {
    if (d.type === 'move') resolveDrop(d.c, !!(e && (e.metaKey || e.ctrlKey)));
    if (d.type === 'sync') { const ns = d.take.sync; d.take.sync = d.os; setTakeSync(d.take, ns); }
    afterEdit();
  }
  S.dirty = true;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('dblclick', (e) => {
  const { x, y } = pos(e);
  if (laneAt(y).kind !== 'edit') return;
  const h = hitEdit(x);
  if (h && h.type === 'junction') auditionJunction();
});

function restartAtPlayhead() {
  const p = S.playing; if (!p) return;
  if (p.mode === 'align') stop();
  else if (p.mode === 'take') playTake(takeOf(p.takeId), S.playhead);
  else play(S.playhead);
}

function hoverCursor(x, y, alt) {
  const lane = laneAt(y);
  let cur = 'default';
  if (lane.kind === 'ruler' && S.markers.some((m) => Math.abs(px(m.t) - x) < 7)) cur = 'ew-resize';
  else if (lane.kind === 'ruler' || (lane.kind === 'edit' && S.shiftDown)) cur = 'text';
  else if (lane.kind === 'edit') {
    const h = hitEdit(x);
    if (h) cur = h.type === 'junction' ? (alt ? 'ew-resize' : 'col-resize') : h.type === 'body' ? (alt ? 'ew-resize' : 'move') : 'ew-resize';
    else cur = S.drag && S.drag.type === 'pan' ? 'grabbing' : 'grab';
  } else if (lane.kind === 'take') cur = alt ? 'ew-resize' : 'text';
  cv.style.cursor = cur;
}

cv.addEventListener('wheel', (e) => {
  const { x } = pos(e);
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    zoomAt(x, Math.exp(-e.deltaY * 0.0025));
  } else if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    e.preventDefault();
    const d = e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX;
    S.view = Math.max(0, S.view + d / S.pps);
    S.dirty = true; updateScroll();
  }
}, { passive: false });

// Knijpen op het trackpad: Chrome/Edge sturen dat als wheel + ctrlKey (hierboven), Safari als gesture-events.
let gestureScale = 1;
cv.addEventListener('gesturestart', (e) => { e.preventDefault(); gestureScale = 1; });
cv.addEventListener('gesturechange', (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(clamp(e.clientX - r.left, 0, cssW), e.scale / gestureScale);
  gestureScale = e.scale;
});
cv.addEventListener('gestureend', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { if (e.key === 'Shift') S.shiftDown = true; });
window.addEventListener('keyup', (e) => { if (e.key === 'Shift') S.shiftDown = false; });
window.addEventListener('blur', () => { S.shiftDown = false; });

function zoomAt(x, f) {
  const t = tAt(x);
  S.pps = clamp(S.pps * f, 0.5, 48000);
  S.view = Math.max(0, t - x / S.pps);
  S.dirty = true; updateScroll();
}
function zoomFit() {
  S.pps = clamp((cssW - 24) / contentEnd(), 0.5, 48000);
  S.view = 0; S.dirty = true; updateScroll();
}
function updateScroll() {
  const sc = $('hscroll');
  const span = cssW / S.pps;
  const max = Math.max(0, contentEnd() + span * 0.3 - span);
  sc.max = String(max); sc.step = String(Math.max(0.001, span / 200));
  sc.value = String(Math.min(S.view, max));
  sc.disabled = max <= 0;
}
$('hscroll').addEventListener('input', (e) => { S.view = +e.target.value; S.dirty = true; });

document.addEventListener('keydown', (e) => {
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  // ⌘Z / Ctrl+Z werkt overal, ook als de cursor nog in een getalveld staat (alleen in een tekstveld niet).
  if (mod && k.toLowerCase() === 'z' && !e.target.matches('input[type=text], textarea')) {
    e.preventDefault(); if (e.target.blur) e.target.blur(); e.shiftKey ? redo() : undo(); return;
  }
  if (e.target.matches('input[type=text], input[type=number], select, textarea')) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (k === ' ') { e.preventDefault(); if (e.target.blur) e.target.blur(); togglePlay(); return; }
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod) return;
  const sj = S.sel && S.sel.kind === 'junction' ? junctionOf(S.sel.a, S.sel.b) : null;
  switch (k) {
    case 's': case 'S': splitAt(S.playhead); break;
    case 'e': case 'E': editAction(); break;
    case 'd': case 'D': setDestPoint(S.playhead, e.shiftKey); break;
    case 'b': case 'B': setSourcePoint(e.shiftKey); break;
    case 'h': case 'H': alignTakesHere(); break;
    case 'a': case 'A': if (S.playing) stop(); else auditionJunction(); renderInspector(); break;
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSelection(e.altKey); break;
    case '+': case '=': zoomAt(px(S.playhead) >= 0 && px(S.playhead) <= cssW ? px(S.playhead) : cssW / 2, 1.5); break;
    case '-': case '_': zoomAt(cssW / 2, 1 / 1.5); break;
    case 'f': case 'F': zoomFit(); break;
    case 'm': case 'M': addMarker(); break;
    case ',': case '<': jumpMarker(-1); break;
    case '.': case '>': jumpMarker(1); break;
    case 'l': case 'L': toggleLoop(); break;
    case 'Home': S.playhead = 0; S.view = 0; S.dirty = true; updateScroll(); if (S.playing) restartAtPlayhead(); break;
    case 'End': S.playhead = editEnd(); break;
    case 'Escape': S.range = null; clearPoints(); select(null); break;
    case 'ArrowLeft': case 'ArrowRight': {
      e.preventDefault();
      const dir = k === 'ArrowLeft' ? -1 : 1;
      if (S.sel && S.sel.kind === 'align') {
        const sr = S.ac ? S.ac.sampleRate : 48000;
        nudgeAlign(dir * (e.altKey ? 1 / sr : e.shiftKey ? 0.01 : 0.001));
      } else if (sj) mutate(() => roll(sj.a, sj.b, dir * (e.shiftKey ? 0.01 : 0.001)));
      else { S.playhead = Math.max(0, S.playhead + dir * (e.shiftKey ? 0.1 : 1)); if (S.playing) restartAtPlayhead(); }
      break;
    }
  }
});

/* ---------- demo ---------- */
function makeDemo() {
  const ac = ensureAC();
  const sr = ac.sampleRate, beat = 0.5, dur = 16 * beat * 2 + 1;
  // Een melodie van 32 tellen; elke take heeft ergens een "fout" zodat comping zin heeft.
  const mel = [64, 67, 69, 71, 72, 71, 69, 67, 65, 69, 72, 76, 74, 72, 71, 69, 67, 71, 74, 77, 76, 74, 72, 71, 69, 72, 71, 69, 67, 69, 71, 72];
  const takes = [
    { name: 'Demo take 1', bright: 0.5, wrong: { 9: 70, 10: 73 }, jitter: 0.012, level: 0.42, seed: 1 },
    { name: 'Demo take 2', bright: 0.7, wrong: { 19: 78, 24: 68 }, jitter: 0.008, level: 0.36, seed: 2 },
    { name: 'Demo take 3', bright: 0.35, wrong: { 3: 72, 28: 66 }, jitter: 0.015, level: 0.45, seed: 3 },
  ];
  busy(true, 'Demo genereren…');
  setTimeout(() => {
    for (const tk of takes) {
      const n = Math.round(dur * sr);
      const buf = ac.createBuffer(1, n, sr), d = buf.getChannelData(0);
      let seed = tk.seed * 9301;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      mel.forEach((m, i) => {
        const midi = tk.wrong[i] ?? m;
        const f = 440 * Math.pow(2, (midi - 69) / 12) * (1 + (rnd() - 0.5) * 0.004);
        const t0 = 0.5 + i * beat + (rnd() - 0.5) * 2 * tk.jitter;
        const s0 = Math.round(t0 * sr), len = Math.round(beat * 1.6 * sr);
        const vel = tk.level * (0.8 + rnd() * 0.3);
        for (let k = 0; k < len && s0 + k < n; k++) {
          const t = k / sr;
          const env = Math.min(1, t / 0.006) * Math.exp(-t * 3.2);
          let v = 0;
          for (let h = 1; h <= 6; h++) v += Math.sin(2 * Math.PI * f * h * t) * Math.pow(tk.bright, h - 1) / h;
          d[s0 + k] += v * env * vel;
        }
      });
      // zachte ruimte/ruis zodat de takes niet digitaal stil zijn
      for (let k = 0; k < n; k++) d[k] += (rnd() - 0.5) * 0.004;
      addTake(tk.name, buf);
    }
    busy(false);
    buildHeads(); zoomFit(); afterEdit();
    toast('Demo geladen: take 1 staat in de edit. Selecteer in take 2 het stuk rond 0:05 en druk E.');
  }, 30);
}

/* ---------- projecten bewaren ----------
   Alles blijft op dit apparaat, in de opslag van de browser/app (IndexedDB):
   - 'files':    de audio van elke take (het originele bestand), sleutel = fileKey
   - 'projects': de edit (clips, sync, namen, zoom) per project
   Er wordt automatisch bewaard, kort na elke wijziging. */
const DBN = 'take-crossfader';
let dbPromise = null;
function idb() {
  if (!dbPromise) {
    dbPromise = new Promise((res, rej) => {
      if (!window.indexedDB) { rej(new Error('Deze browser kan geen projecten bewaren')); return; }
      const r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('projects', { keyPath: 'id' }); db.createObjectStore('files'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    dbPromise.catch(() => { dbPromise = null; });
  }
  return dbPromise;
}
function dbDo(store, mode, fn) {
  return idb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    let out;
    const r = fn(tx.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out);
    tx.onerror = tx.onabort = () => rej(tx.error || new Error('Opslaan mislukt'));
  }));
}
const dbGet = (st, k) => dbDo(st, 'readonly', (o) => o.get(k));
const dbPut = (st, v, k) => dbDo(st, 'readwrite', (o) => (k === undefined ? o.put(v) : o.put(v, k)));
const dbDel = (st, k) => dbDo(st, 'readwrite', (o) => o.delete(k));
const dbAll = (st) => dbDo(st, 'readonly', (o) => o.getAll());
const dbKeys = (st) => dbDo(st, 'readonly', (o) => o.getAllKeys());

const store = {
  get(k) { try { return localStorage.getItem('tcf.' + k); } catch (_) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('tcf.' + k) : localStorage.setItem('tcf.' + k, v); } catch (_) { /* geen opslag */ } },
};

function setSaveState(text) { $('saveState').textContent = text; }
function updateProjectLine() {
  $('projName').textContent = S.project ? S.project.name : 'Nog geen project';
}
function suggestName() {
  const d = new Date();
  const base = S.takes[0] ? S.takes[0].name.replace(/[ _-]*(take)?[ _-]*\d+$/i, '').trim() : '';
  return (base || 'Project') + ' - ' + d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
}

let saveTimer = null, saving = null;
function scheduleSave() {
  if (S.loading || !S.takes.length) return;
  clearTimeout(saveTimer);
  setSaveState('wijzigingen nog niet bewaard…');
  saveTimer = setTimeout(saveProject, 1200);
}
async function saveProject() {
  clearTimeout(saveTimer); saveTimer = null;
  if (S.loading || !S.takes.length) return;
  if (saving) { await saving; }
  saving = (async () => {
    try {
      const first = !S.project;
      if (first) {
        S.project = { id: uid(), name: suggestName(), created: Date.now() };
        updateProjectLine();
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      }
      for (const t of S.takes) {
        if (t.stored) continue;
        setSaveState(`audio van "${t.name}" bewaren…`);
        await dbPut('files', t.file || encodeWav(t.buffer, 32), t.fileKey);
        t.stored = true; t.file = null;
      }
      const p = S.project;
      await dbPut('projects', {
        id: p.id, name: p.name, created: p.created, updated: Date.now(),
        takes: S.takes.map((t) => ({ id: t.id, name: t.name, fileKey: t.fileKey, sync: t.sync, color: t.color, dur: t.buffer.duration })),
        clips: S.clips.map((c) => ({ ...c })), markers: S.markers, nextId: S.nextId,
        view: { pps: S.pps, view: S.view, playhead: S.playhead }, length: editEnd(),
      });
      store.set('last', p.id);
      if (S.needCleanup) { S.needCleanup = false; await cleanupFiles(); }
      setSaveState('bewaard om ' + new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }));
      if (first) toast(`Project "${p.name}" wordt vanaf nu automatisch bewaard`);
    } catch (err) {
      console.error(err);
      setSaveState('NIET bewaard');
      toast('Bewaren mislukt: ' + (err && err.name === 'QuotaExceededError' ? 'onvoldoende opslagruimte. Verwijder oude projecten.' : (err && err.message) || err));
    }
  })();
  await saving; saving = null;
}

/** Verwijder audio die door geen enkel project meer wordt gebruikt. */
async function cleanupFiles() {
  const projects = await dbAll('projects');
  const used = new Set(S.takes.map((t) => t.fileKey));
  for (const p of projects) for (const t of p.takes) used.add(t.fileKey);
  for (const k of await dbKeys('files')) if (!used.has(k)) await dbDel('files', k);
}

/* ---------- project als bestand ----------
   Eén bestand (.crossfader) met de edit én de audio: als back-up of om op een andere computer verder te werken.
   Opbouw: "TCFPROJ1" · uint32 lengte · JSON-kop · de audiobestanden achter elkaar. */
const PROJ_MAGIC = 'TCFPROJ1';
async function exportProjectFile() {
  if (!S.takes.length) { toast('Er is nog geen project om te bewaren'); return; }
  busy(true, 'Projectbestand maken…');
  try {
    await saveProject();
    const rec = await dbGet('projects', S.project.id);
    const files = [], blobs = [];
    for (const t of rec.takes) {
      const b = await dbGet('files', t.fileKey);
      if (!b) throw new Error(`audio van "${t.name}" ontbreekt`);
      files.push({ key: t.fileKey, size: b.size, type: b.type || 'application/octet-stream' });
      blobs.push(b);
    }
    const head = new TextEncoder().encode(JSON.stringify({ format: 1, app: 'Take Crossfader', project: rec, files }));
    const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, head.length, true);
    const blob = new Blob([PROJ_MAGIC, len, head, ...blobs], { type: 'application/octet-stream' });
    download(blob, safeName(rec.name) + '.crossfader');
    toast(`Projectbestand gemaakt (${(blob.size / 1048576).toFixed(1)} MB). Bewaar het bijvoorbeeld in iCloud Drive of op een USB-stick.`);
  } catch (err) {
    console.error(err); toast('Projectbestand maken mislukt: ' + (err.message || err));
  } finally { busy(false); }
}

async function importProjectFile(file) {
  busy(true, `"${file.name}" openen…`);
  try {
    const first = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    if (new TextDecoder().decode(first.slice(0, 8)) !== PROJ_MAGIC) throw new Error('dit is geen Take Crossfader-projectbestand');
    const hl = new DataView(first.buffer).getUint32(8, true);
    const head = JSON.parse(new TextDecoder().decode(await file.slice(12, 12 + hl).arrayBuffer()));
    const rec = head.project, keyMap = {};
    let off = 12 + hl;
    for (const f of head.files) {
      const nk = uid();
      busy(true, `Audio overnemen… (${Object.keys(keyMap).length + 1}/${head.files.length})`);
      await dbPut('files', file.slice(off, off + f.size, f.type), nk);
      keyMap[f.key] = nk; off += f.size;
    }
    const existing = await dbAll('projects');
    rec.id = uid();
    rec.takes = rec.takes.map((t) => ({ ...t, fileKey: keyMap[t.fileKey] }));
    if (existing.some((p) => p.name === rec.name)) rec.name += ' (geïmporteerd)';
    rec.updated = Date.now();
    await dbPut('projects', rec);
    busy(false);
    await loadProject(rec.id);
  } catch (err) {
    console.error(err); busy(false); toast('Projectbestand openen mislukt: ' + (err.message || err));
  }
}

function resetWorkspace() {
  stop();
  S.takes = []; S.clips = []; S.markers = []; S.undo = []; S.redo = [];
  S.pts = { dest: null, destOut: null, src: null, srcOut: null };
  S.sel = null; S.range = null; S.project = null; S.playhead = 0; S.view = 0;
  updateProjectLine(); setSaveState('wordt automatisch bewaard');
  buildHeads(); S.loading = true; afterEdit(); S.loading = false;
}

async function newProject() {
  if (saveTimer || saving) await saveProject();
  resetWorkspace();
  store.set('last', null);
  toast('Nieuw, leeg project. Importeer takes om te beginnen.');
}

async function loadProject(id) {
  const rec = await dbGet('projects', id);
  if (!rec) throw new Error('Project niet gevonden');
  if (saveTimer || saving) await saveProject();
  stop();
  const ac = ensureAC();
  S.loading = true;
  const takes = [], missing = [];
  try {
    for (const tk of rec.takes) {
      busy(true, `Project "${rec.name}" openen: ${tk.name}…`);
      const blob = await dbGet('files', tk.fileKey);
      if (!blob) { missing.push(tk.name); continue; }
      const buf = await decodeAudio(ac, await (blob.arrayBuffer ? blob.arrayBuffer() : new Response(blob).arrayBuffer()));
      const data = [];
      for (let ch = 0; ch < buf.numberOfChannels; ch++) data.push(buf.getChannelData(ch));
      takes.push({ id: tk.id, name: tk.name, sync: tk.sync, color: tk.color, fileKey: tk.fileKey, buffer: buf, data, peaks: computePeaks(buf), file: null, stored: true });
    }
    S.takes = takes;
    S.clips = rec.clips.filter((c) => takes.some((t) => t.id === c.takeId));
    S.markers = rec.markers || [];
    S.pts = { dest: null, destOut: null, src: null, srcOut: null };
    S.nextId = Math.max(rec.nextId || 1, ...takes.map((t) => t.id + 1), ...S.clips.map((c) => c.id + 1));
    S.project = { id: rec.id, name: rec.name, created: rec.created };
    S.undo = []; S.redo = []; S.sel = null; S.range = null;
    if (rec.view) { S.pps = rec.view.pps; S.view = rec.view.view; S.playhead = rec.view.playhead; }
    store.set('last', rec.id);
    updateProjectLine();
    buildHeads(); afterEdit();
    setSaveState('bewaard op ' + new Date(rec.updated).toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }));
    toast(missing.length ? `Geopend, maar audio ontbreekt van: ${missing.join(', ')}` : `Project "${rec.name}" geopend`);
  } finally {
    S.loading = false; busy(false);
  }
}

function openProjects() { select({ kind: 'projects' }); }

async function inspectProjects(el) {
  el.innerHTML = `<div class="insp-head"><h2>Projecten</h2><span>alles wordt op dit apparaat bewaard, automatisch</span></div><p class="hint">Laden…</p>`;

  try { est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (_) { /* onbekend */ }
  if (!S.sel || S.sel.kind !== 'projects') return;      // intussen weggeklikt
  list.sort((a, b) => b.updated - a.updated);

    ${S.project ? `<div class="row">
      <label>Naam van dit project <input type="text" id="pjName" value="${esc(S.project.name)}" style="width:260px"></label>
      <button id="pjSaveNow">Nu bewaren</button>
    </div>` : `<p class="hint">Het huidige werk wordt een project zodra je takes importeert.</p>`}
    <div class="row"><button id="pjNew" class="primary">Nieuw project</button>
      ${S.project ? '<button id="pjExport" title="Eén bestand met de edit en alle audio, als back-up of om op een andere computer verder te werken">Project als bestand bewaren…</button>' : ''}
      <button id="pjImport" title="Een .crossfader-bestand openen (wordt als nieuw project toegevoegd)">Projectbestand openen…</button>
      ${est && est.quota ? `<span class="hint">Opslag in gebruik: ${mb(est.usage || 0)} van ${mb(est.quota)}</span>` : ''}</div>
    <div class="plist">${list.length ? list.map((p) => `
      <div class="pitem${p.id === cur ? ' cur' : ''}">
        <span class="pname">${esc(p.name)}</span>
        <span class="pmeta">${p.takes.length} take${p.takes.length === 1 ? '' : 's'} · edit ${fmt(p.length || 0, 0)} · ${new Date(p.updated).toLocaleString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
        ${p.id === cur ? '<b>geopend</b>' : `<button data-open="${p.id}" class="primary">Openen</button>`}
        <button data-del="${p.id}" class="danger">Verwijder</button>
      </div>`).join('') : '<p class="hint">Nog geen bewaarde projecten.</p>'}</div>`;
  if (S.project) {
    $('pjName').onchange = (e) => { S.project.name = e.target.value.trim() || S.project.name; updateProjectLine(); saveProject().then(() => renderInspector()); };
    $('pjSaveNow').onclick = () => saveProject().then(() => renderInspector());
  }
  $('pjNew').onclick = () => newProject();
  if ($('pjExport')) $('pjExport').onclick = exportProjectFile;
  $('pjImport').onclick = () => $('projFileInput').click();
  el.querySelectorAll('[data-open]').forEach((b) => {
    b.onclick = () => loadProject(b.dataset.open).catch((err) => { busy(false); toast('Openen mislukt: ' + (err.message || err)); });
  });
  el.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      const p = list.find((x) => x.id === b.dataset.del);
      if (!confirm(`Project "${p.name}" en de bijbehorende audio definitief verwijderen? Dit kan niet ongedaan worden gemaakt.`)) return;
      await dbDel('projects', p.id);
      if (p.id === cur) { clearTimeout(saveTimer); saveTimer = null; resetWorkspace(); store.set('last', null); }
      await cleanupFiles();
      toast(`Project "${p.name}" verwijderd`);
      openProjects();
    };
  });
}

// bewaar meteen als de app naar de achtergrond gaat of sluit
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) saveProject(); });
window.addEventListener('pagehide', () => { if (saveTimer) saveProject(); });

/* instellingen (per apparaat) */
function saveSettings() {
  store.set('settings', JSON.stringify({ zc: S.zeroCross, snap: S.snap, defXf: S.defXf, rts: S.returnToStart, sc2: S.syncClips, preroll: S.preroll, fmt: S.exportFmt, norm: S.normalize, normDb: S.normDb }));
}
function loadSettings() {
  let o = null; try { o = JSON.parse(store.get('settings') || 'null'); } catch (_) { o = null; }
  if (!o) return;
  if (typeof o.snap === 'boolean') S.snap = o.snap;
  if (typeof o.zc === 'boolean') S.zeroCross = o.zc;
  if (typeof o.defXf === 'number') S.defXf = o.defXf;
  if (typeof o.rts === 'boolean') S.returnToStart = o.rts;
  if (typeof o.sc2 === 'boolean') S.syncClips = o.sc2;
  if (typeof o.preroll === 'number') S.preroll = o.preroll;
  if (o.fmt) S.exportFmt = o.fmt;
  if (typeof o.norm === 'boolean') S.normalize = o.norm;
  if (typeof o.normDb === 'number') S.normDb = o.normDb;
}
function applySettingsUI() {
  $('snapChk').checked = S.snap; $('zcChk').checked = S.zeroCross; $('defXf').value = ms(S.defXf); $('rtsChk').checked = S.returnToStart;
}

/* ---------- app: offline + installeren ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  // Eigen service worker met scope ./ (alleen de editor), los van die van de Tuinplanner.
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch((err) => console.warn('Service worker niet geregistreerd:', err));
}
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  $('installBtn').hidden = false;
});
$('installBtn').onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice.catch(() => null);
  installPrompt = null;
  $('installBtn').hidden = true;
};
window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; toast('Take Crossfader is geïnstalleerd'); });

/* ---------- start ---------- */
loadSettings();
applySettingsUI();
new ResizeObserver(() => resize()).observe($('canvasWrap'));
buildHeads();
renderInspector();
updateButtons();
requestAnimationFrame(frame);
// verder waar je gebleven was
(async () => {
  const last = store.get('last');
  if (!last) return;
  try { await loadProject(last); }
  catch (err) { console.warn(err); store.set('last', null); busy(false); }
})();
</script>
</body>
</html>
